<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Log Viewer</title>
<style>
  /* ================= デザイントークン ================= */
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --surface-2: #fafafc; --surface-3: #f0f0f3;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
    --sep: rgba(0, 0, 0, .08); --sep-strong: rgba(0, 0, 0, .14);
    --accent: #0071e3; --accent-hover: #0077ed; --accent-soft: rgba(0, 113, 227, .10); --accent-text: #0066cc;
    --red: #ff3b30; --green: #34c759; --orange: #ff9500;
    --sel: rgba(0, 113, 227, .10); --hover: rgba(0, 0, 0, .025);
    --mark: #ffe58f; --mark-cur: #ffb340;
    --tint: 100%;                 /* ルール色の濃さ（ダークでは薄めて文字を読みやすく） */
    --bar: rgba(255, 255, 255, .72);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .04), 0 1px 1px rgba(0, 0, 0, .02);
    --shadow-2: 0 10px 40px rgba(0, 0, 0, .12), 0 2px 8px rgba(0, 0, 0, .06);
    --switch-off: #e9e9eb;
    --r-card: 16px; --r-ctl: 10px;
    --row-h: 24px;
    --ln-w: 64px; --src-w: 112px; --dt-w: 108px; --cm-w: 260px; --st-w: 160px;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Segoe UI", "Meiryo", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, "Cascadia Mono", Consolas, "MS Gothic", monospace;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #232325; --surface-3: #2c2c2e;
    --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93;
    --sep: rgba(255, 255, 255, .10); --sep-strong: rgba(255, 255, 255, .18);
    --accent: #0a84ff; --accent-hover: #409cff; --accent-soft: rgba(10, 132, 255, .18); --accent-text: #4aa3ff;
    --red: #ff453a; --green: #30d158; --orange: #ff9f0a;
    --sel: rgba(10, 132, 255, .22); --hover: rgba(255, 255, 255, .04);
    --mark: #8a6d00; --mark-cur: #b36b00;
    --tint: 32%;
    --bar: rgba(28, 28, 30, .72);
    --shadow-1: 0 0 0 1px rgba(255, 255, 255, .06);
    --shadow-2: 0 20px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .08);
    --switch-off: #39393d;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui); display: flex; flex-direction: column;
         -webkit-font-smoothing: antialiased; letter-spacing: .01em; }
  button, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; border-radius: 8px; }
  ::selection { background: var(--accent-soft); }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ================= タイトルバー ================= */
  .titlebar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 6px; padding: 10px 20px;
              background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
              border-bottom: 1px solid var(--sep); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; margin-right: 10px; white-space: nowrap; }
  .brand .logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #fff;
                 background: linear-gradient(145deg, #5ac8fa, #0071e3); box-shadow: 0 1px 3px rgba(0, 113, 227, .35); }
  .brand .logo svg { width: 15px; height: 15px; stroke-width: 2; }
  .spacer { flex: 1; }

  /* ボタン: ツール (透明) / 主要 (青) / 補助 (グレー) */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: var(--r-ctl);
         background: transparent; color: var(--text); cursor: pointer; font-weight: 500; white-space: nowrap;
         transition: background-color .15s, color .15s, transform .05s; }
  .btn:hover { background: var(--hover); background: color-mix(in srgb, var(--text) 6%, transparent); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  .btn.primary { background: var(--accent); color: #fff; padding: 0 16px; border-radius: 980px; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--surface-3); border-radius: 980px; padding: 0 16px; }
  .btn.secondary:hover { background: color-mix(in srgb, var(--text) 10%, var(--surface-3)); }
  .btn.danger { color: var(--red); }
  .btn.wide { height: 36px; padding: 0 18px; }
  .btn .lbl { }

  /* ================= コントロール行 ================= */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 16px 20px 0; padding: 12px 16px;
              background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-1); }
  .controls .group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .controls .fields { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .info { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* iOS 風スイッチ */
  .switch { display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 2px; border: 0; background: none; cursor: pointer; font-weight: 500; color: var(--text); white-space: nowrap; }
  .switch .track { position: relative; width: 38px; height: 23px; border-radius: 999px; background: var(--switch-off); transition: background-color .2s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff;
                          box-shadow: 0 2px 4px rgba(0, 0, 0, .2), 0 0 1px rgba(0, 0, 0, .15); transition: transform .22s cubic-bezier(.3, .7, .4, 1.2); }
  .switch.on .track { background: var(--green); }
  .switch.on .track::after { transform: translateX(15px); }
  .switch kbd { font: 11px var(--ui); color: var(--text-3); }

  /* 検索フィールド */
  .field { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; background: var(--surface-3); border-radius: var(--r-ctl);
           border: 1px solid transparent; transition: border-color .15s, background-color .15s, box-shadow .15s; color: var(--text-3); }
  .field:focus-within { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field input { border: 0; outline: 0; width: 190px; background: transparent; color: var(--text); }
  .field input::placeholder { color: var(--text-3); }
  .field .count { font-size: 12px; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .field.bad, .field.bad:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }

  /* ================= タブ（ピル型） ================= */
  .tabs { display: flex; gap: 4px; margin: 14px 20px 0; padding: 4px; overflow-x: auto; scrollbar-width: none;
          background: color-mix(in srgb, var(--text) 5%, transparent); border-radius: 12px; align-self: flex-start; max-width: calc(100% - 40px); }
  .tabs:empty { display: none; }
  .tab { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 14px; border-radius: 9px; cursor: pointer; white-space: nowrap;
         font-weight: 500; color: var(--text-2); transition: background-color .15s, color .15s; user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1), 0 0 0 .5px rgba(0, 0, 0, .04); }
  .tab .x { width: 18px; height: 18px; border: 0; border-radius: 50%; background: none; color: var(--text-3); cursor: pointer; display: grid; place-items: center; padding: 0; font-size: 13px; line-height: 1; }
  .tab .x:hover { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
  .tab.dragging { opacity: .4; }
  .tab.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
  .tab.drop-after { box-shadow: inset -2px 0 0 var(--accent); }

  /* ツールチップ */
  .tip { position: fixed; z-index: 60; padding: 10px 14px; border-radius: 12px; font-size: 12px; line-height: 1.75; pointer-events: none;
         max-width: min(460px, calc(100vw - 16px)); word-break: break-all; color: var(--text);
         background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
         box-shadow: var(--shadow-2); }
  .tip b { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
  .tip .k { color: var(--text-2); display: inline-block; min-width: 6.5em; }
  .tip .note { color: var(--orange); }

  /* ================= ログ表示カード ================= */
  .main { flex: 1 0 auto; min-height: 260px; height: 0; margin: 10px 20px 0; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-1);
          display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--sep); }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 999px; border: 0; cursor: pointer;
          font-size: 12px; font-weight: 500; color: var(--text); background: var(--surface-3); transition: background-color .15s, transform .05s; }
  .chip:hover { background: color-mix(in srgb, var(--text) 9%, var(--surface-3)); }
  .chip:active { transform: scale(.97); }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
  .chip b { font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .chip.zero { opacity: .45; cursor: default; }

  .scroller { flex: 1; min-height: 0; overflow: auto; position: relative; outline: none; }
  .scroller::-webkit-scrollbar { width: 12px; height: 12px; }
  .scroller::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 22%, transparent); border-radius: 8px; border: 3px solid var(--surface); }
  .scroller::-webkit-scrollbar-corner { background: var(--surface); }
  .canvas { position: relative; }
  .row, .head { display: flex; height: var(--row-h); line-height: var(--row-h); font: 12.5px var(--mono); white-space: pre; }
  .row { position: absolute; left: 0; cursor: default; }
  .head { position: sticky; top: 0; z-index: 3; font: 600 11px var(--ui); letter-spacing: .04em; color: var(--text-2);
          background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
          border-bottom: 1px solid var(--sep); height: 30px; line-height: 30px; }
  .L, .R { display: flex; flex: none; position: sticky; z-index: 2; }
  .L { left: 0; }
  .R { right: 0; }
  .cell { overflow: hidden; padding: 0 10px; flex: none; text-overflow: ellipsis; }
  .ln { width: var(--ln-w); text-align: right; color: var(--text-3); background: var(--surface); font-variant-numeric: tabular-nums; }
  .src { width: var(--src-w); color: var(--text-2); background: var(--surface); font-family: var(--ui); font-size: 12px; }
  .dt { width: var(--dt-w); text-align: right; color: var(--text-3); background: var(--surface); border-right: 1px solid var(--sep); font-variant-numeric: tabular-nums; }
  .log { padding-left: 14px; }
  /* 列の境界線（見出しでドラッグして幅を変更） */
  .head .cell { position: relative; }
  .rz { position: absolute; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 5; touch-action: none; }
  .rz-r { right: 0; }
  .rz-l { left: 0; }
  .rz::after { content: ""; position: absolute; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: transparent; transition: background-color .15s; }
  .rz-r::after { right: 0; }
  .rz-l::after { left: 0; }
  .head:hover .rz::after { background: var(--sep-strong); }
  .rz:hover::after { background: var(--accent) !important; top: 4px; bottom: 4px; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  .log.c, .st.c { background: color-mix(in srgb, var(--c) var(--tint), var(--surface)); }
  .cm { width: var(--cm-w); color: var(--accent-text); background: var(--surface); border-left: 1px solid var(--sep); font-family: var(--ui); font-size: 12px; }
  .R { box-shadow: -12px 0 12px -12px rgba(0, 0, 0, .12); }
  .st { width: var(--st-w); background: var(--surface); border-left: 1px solid var(--sep); font-family: var(--ui); font-size: 12px; color: var(--text); }
  .head .cell { background: transparent; color: var(--text-2); text-align: left; }
  .head .L, .head .R { background: color-mix(in srgb, var(--surface) 92%, transparent); }
  .head .R { box-shadow: none; }
  .row:hover .log:not(.c) { background: var(--hover); }
  .row.virt .log { color: var(--text-3); font-style: italic; }
  .row.sel .ln { color: #fff; background: var(--accent); }
  .row.sel .log { box-shadow: inset 0 0 0 9999px var(--sel); }
  .row.sel .dt, .row.sel .src, .row.sel .cm { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .row.base .dt { color: var(--red); font-weight: 600; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.cur { background: var(--mark-cur); }

  .status { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 24px 12px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .status .err { color: var(--red); }

  /* 空の状態 */
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
           text-align: center; padding: 24px; color: var(--text-2); pointer-events: none; }
  .empty .glyph { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; color: var(--accent);
                  background: var(--accent-soft); margin-bottom: 4px; }
  .empty .glyph svg { width: 30px; height: 30px; stroke-width: 1.6; }
  .empty strong { color: var(--text); font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .empty p { margin: 0; max-width: 520px; }
  .empty .btn { pointer-events: auto; margin-top: 6px; }
  .empty .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12px; color: var(--text-3); margin-top: 8px; }
  .empty kbd, .menu kbd { font: 11px var(--ui); padding: 1px 6px; border-radius: 5px; background: var(--surface-3); color: var(--text-2); border: 1px solid var(--sep); }
  body.drag .main { box-shadow: 0 0 0 3px var(--accent), var(--shadow-1); }
  body.drag .empty .glyph { transform: scale(1.06); transition: transform .2s; }

  /* ================= メニュー（ポップオーバー） ================= */
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 260px; padding: 6px;
          background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
          border-radius: 12px; box-shadow: var(--shadow-2); transform-origin: top right; animation: pop .16s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
  .menu button:hover { background: var(--accent); color: #fff; }
  .menu hr { border: 0; border-top: 1px solid var(--sep); margin: 5px 8px; }
  .menu .check::before { content: ""; display: inline-block; width: 14px; text-align: center; font-weight: 600; }
  .menu .check.on::before { content: "✓"; }

  /* ================= シート（ダイアログ） ================= */
  dialog { border: 0; border-radius: 20px; padding: 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow-2);
           max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); }
  dialog[open] { animation: sheet .22s cubic-bezier(.2, .8, .2, 1); }
  @keyframes sheet { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  dialog::backdrop { background: rgba(0, 0, 0, .28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .dlg { display: flex; flex-direction: column; gap: 14px; padding: 22px 24px; max-height: calc(100vh - 24px); }
  .dlg h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .dlg .sub { margin: -8px 0 0; font-size: 13px; color: var(--text-2); }
  #editDlg { width: 1280px; }
  .ed-body { display: flex; gap: 16px; min-height: 0; flex: 1; }
  .ed-table-wrap { flex: 1; min-width: 0; overflow: auto; background: var(--surface-2); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--sep); max-height: calc(100vh - 190px); }
  .ed-table { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100%; }
  .ed-table th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); color: var(--text-2); text-align: left; padding: 10px 6px 8px; white-space: nowrap;
                 font-weight: 600; font-size: 11px; letter-spacing: .03em; border-bottom: 1px solid var(--sep); }
  .ed-table td { padding: 4px; border-bottom: 1px solid var(--sep); vertical-align: middle; }
  .ed-table tr:last-child td { border-bottom: 0; }
  .ed-table tr.off td:not(.ops) { opacity: .4; }
  .ed-table input[type=text] { width: 100%; height: 28px; border: 1px solid var(--sep-strong); border-radius: 7px; padding: 0 8px; font: 12px var(--mono);
                               background: var(--surface); color: var(--text); transition: border-color .15s, box-shadow .15s; }
  .ed-table input[type=text]:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ed-table input[type=text].bad { border-color: var(--red); background: color-mix(in srgb, var(--red) 6%, var(--surface)); }
  .ed-table input[type=checkbox], .form-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .ed-table .ops { white-space: nowrap; padding-left: 10px; }
  .ed-table .ops button, .ed-table .inline button { height: 26px; min-width: 26px; border: 0; border-radius: 7px; padding: 0 8px; cursor: pointer;
                                                    background: var(--surface-3); color: var(--text); margin-left: 2px; }
  .ed-table .ops button:hover, .ed-table .inline button:hover { background: color-mix(in srgb, var(--text) 10%, var(--surface-3)); }
  .ed-table .ops button.del { color: var(--red); }
  .ed-table .inline { display: flex; gap: 4px; align-items: center; }
  .ed-table .inline button.v { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .ed-table input[type=color] { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: none; flex: none; cursor: pointer; }
  .ed-table input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  .ed-table input[type=color]::-webkit-color-swatch { border: 1px solid var(--sep-strong); border-radius: 6px; }
  .ed-side { width: 260px; flex: none; display: flex; flex-direction: column; gap: 12px; }
  .ed-info { background: var(--surface-2); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--sep); padding: 12px 14px; font-size: 12px; line-height: 1.65;
             color: var(--text-2); white-space: pre-wrap; overflow: auto; flex: 1; min-height: 80px; }
  .ed-err { color: var(--red); font-size: 12px; white-space: pre-wrap; }
  .ed-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .form-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  .form-row input[type=text] { height: 30px; border: 1px solid var(--sep-strong); border-radius: 8px; padding: 0 10px; width: 150px; font: 13px var(--mono); background: var(--surface); color: var(--text); }
  .form-row input[type=text]:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .form-row input.bad { border-color: var(--red); }
  fieldset { border: 0; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--sep); display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; margin: 0; }
  legend { font-weight: 600; font-size: 11px; letter-spacing: .04em; color: var(--text-2); padding: 0; margin-bottom: -4px; float: left; }

  /* ================= 狭い画面 ================= */
  @media (max-width: 900px) {
    .ed-body { flex-direction: column; flex: none; }
    .ed-side { width: auto; }
    .dlg { overflow: auto; padding: 18px; }
    .ed-info { max-height: 90px; min-height: 0; flex: none; }
    .ed-table-wrap { flex: none; min-height: 160px; max-height: max(160px, calc(100vh - 340px)); }
  }
  @media (max-width: 720px) {
    :root { --ln-w: 48px; --dt-w: 88px; --cm-w: 160px; --st-w: 120px; --src-w: 90px; }
    .titlebar { padding: 8px 12px; }
    .brand span, .btn .lbl { display: none; }
    .btn { padding: 0 9px; }
    .controls, .main { margin-left: 8px; margin-right: 8px; }
    .tabs { margin-left: 8px; margin-right: 8px; max-width: calc(100% - 16px); }
    .controls .fields { margin-left: 0; width: 100%; }
    .field { flex: 1; }
    .field input { width: 100%; min-width: 0; }

<script>
"use strict";
// ================= 定数（Python 版と同じ） =================
const VSYNC_TAG = "<VSYNC>";
const VSYNC_REGEX = String.raw`V_START|V-Sync|VIRTUAL V-SYNC|\[VIRTUAL V-SYNC\]`;
const VSYNC_RE = new RegExp(VSYNC_REGEX, "i");
const VSYNC_MARKER = "--- [VIRTUAL V-SYNC] ---";
const VIRTUAL_SRC = "(Virtual)";
const TIMER_MARK = "[VIRTUAL TIMER]";
const ORIGIN_MARK = "<<< [V-SYNC 起点]";
const WHITE = "#ffffff";
const ROSE = "#d4a3b3";
const PY_DEFAULT_TS = String.raw`^\[?\s*(\d+(?:\.\d+)?)\]?`;
// hh:mm:ss(.fff) と秒数の両方に対応（Python 版の既定パターンは hh:mm:ss の時が取れない）
const DEFAULT_TS = String.raw`^\[?\s*(\d{1,2}:\d{2}:\d{2}(?:\.\d+)?|\d+(?:\.\d+)?)\]?`;
const DEFAULT_CONFIG = {
  keywords: [
    { file_pattern: ".*", pattern: ".*ERROR.*", color: "#f8d7da", comment: "重大なエラー発生", enabled: true },
    { file_pattern: ".*", pattern: "WARN", color: "#fff3cd", comment: "警告メッセージ", enabled: true },
    { file_pattern: ".*", pattern: "INFO", color: "#d1e7dd", comment: "正常動作ログ", enabled: true },
    { file_pattern: ".*", pattern: String.raw`--- \[VIRTUAL V-SYNC\] ---`, color: "#e2d9f3", comment: "仮想V同期タイミング", enabled: true },
    { file_pattern: ".*", pattern: String.raw`--- \[VIRTUAL TIMER\].*`, color: "#ffe0b2", comment: "タイマー満了", enabled: true },
  ],
  sections: [
    { name: "初期化(Server)", start: "SRV_INIT_START", start_wait: false, end: "SRV_INIT_DONE", end_wait: false, duration_ms: "", color: "#e1f5fe", file_pattern: "server.*", enabled: true },
    { name: "初期化(Client)", start: "CLI_BOOT", start_wait: false, end: "CLI_READY", end_wait: false, duration_ms: "", color: "#e0f2f1", file_pattern: "client.*", enabled: true },
    { name: "通信処理", start: "CONNECT", start_wait: false, end: "DISCONNECT", end_wait: false, duration_ms: "", color: "#fff3e0", file_pattern: ".*", enabled: true },
  ],
  replace_patterns: [],
  vsync_auto_insert: { enabled: true, time_pattern: DEFAULT_TS, manual_ms: 16.666, start_time_val: "0.0" },
};
const STORE_KEY = "logviewer.config.v2";
const OVERSCAN = 20;

const $ = (id) => document.getElementById(id);
const state = {
  docs: [], active: -1, filterOn: false, showVsync: false, advanced: false, mergeTsLen: 19,
  config: null, rules: [], sections: [], errors: [], strictTs: false,
};
let rowH = 20, charW = 7.2;

// ================= 設定 =================
function normalizeConfig(cfg) {
  const c = JSON.parse(JSON.stringify(cfg || {}));
  c.keywords = Array.isArray(c.keywords) ? c.keywords : [];
  c.sections = Array.isArray(c.sections) ? c.sections : [];
  c.replace_patterns = Array.isArray(c.replace_patterns) ? c.replace_patterns : [];
  c.vsync_auto_insert = Object.assign({ enabled: true, time_pattern: DEFAULT_TS, manual_ms: 16.666, start_time_val: "0.0" }, c.vsync_auto_insert || {});
  return c;
}
function loadStoredConfig() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalizeConfig(JSON.parse(raw));
  } catch (e) { /* 保存領域が使えない環境では既定値 */ }
  return normalizeConfig(DEFAULT_CONFIG);
}
function storeConfig() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.config)); } catch (e) { /* 無視 */ }
}
// Python の float() 相当（変換できなければ NaN）
function pyFloat(v) {
  if (typeof v === "number") return v;
  if (typeof v !== "string" || v.trim() === "") return NaN;
  return Number(v.trim());
}
// Python の float の文字列化（5.0 → "5.0"）
function pyFloatStr(x) { return Number.isInteger(x) ? x.toFixed(1) : String(x); }
// Python 版と同じパターン正規化（% は空白の省略記法）
function normalizePattern(p) {
  p = String(p).trim().replace(/%/g, String.raw`\s*`);
  if (p.length > 4 && p.startsWith(".*") && p.endsWith(".*")) p = p.slice(2, -2).trim();
  if (p.length > 6 && p.startsWith("^.*") && p.endsWith(".*$")) p = p.slice(3, -3).trim();
  return pyToJsRegex(p);
}
// Python 正規表現の書き方のうち JS と異なるものを変換
function pyToJsRegex(p) {
  return String(p).replace(/^\(\?i\)/, "").replace(/\(\?P</g, "(?<").replace(/\(\?P=(\w+)\)/g, String.raw`\k<$1>`);
}
function compileRules() {
  const cfg = state.config;
  state.rules = []; state.sections = []; state.errors = [];
  cfg.keywords.forEach((k, i) => {
    if (k.enabled === false) return;
    try {
      state.rules.push({
        filePat: new RegExp(pyToJsRegex(k.file_pattern || ".*"), "i"),
        re: new RegExp(normalizePattern(k.pattern), "is"),
        color: k.color || WHITE, comment: k.comment || "", label: k.comment || k.pattern,
      });
    } catch (e) { state.errors.push(`フィルタ${i + 1}「${k.pattern}」: ${e.message}`); }
  });
  if (!cfg.keywords.some((k) => String(k.pattern ?? "").includes("VIRTUAL TIMER"))) {
    state.rules.push({ filePat: /.*/, re: /\[VIRTUAL TIMER\]/i, color: "#ffe8d6", comment: "タイマー満了", label: "タイマー満了" });
  }
  cfg.sections.forEach((s, i) => {
    if (s.enabled === false) return;
    try {
      if (s.end === undefined || s.start === undefined || s.name === undefined) throw new Error("start/end/name がありません");
      let endPat = String(s.end), isVsyncEnd = false;
      if (endPat === VSYNC_TAG) { endPat = VSYNC_REGEX; isVsyncEnd = true; }
      let dur = pyFloat(s.duration_ms || 0);
      if (isNaN(dur)) dur = 0;
      state.sections.push({
        start: new RegExp(pyToJsRegex(s.start), "i"), startWait: !!s.start_wait,
        end: endPat ? new RegExp(pyToJsRegex(endPat), "i") : null, endStr: endPat, endWait: !!s.end_wait,
        dur, name: s.name, color: s.color || WHITE, filePat: new RegExp(pyToJsRegex(s.file_pattern || ".*"), "i"), isVsyncEnd,
      });
    } catch (e) { state.errors.push(`区間${i + 1}「${s.name ?? ""}」: ${e.message}`); }
  });
}
function tsRegex() {
  let p = state.config.vsync_auto_insert.time_pattern || DEFAULT_TS;
  if (p === PY_DEFAULT_TS && !state.strictTs) p = DEFAULT_TS;
  try { return new RegExp(pyToJsRegex(p)); } catch (e) { return new RegExp(DEFAULT_TS); }
}

// ================= 解析（Python 版のロジックを移植） =================
function splitLines(text) {
  const lines = text.split(/\r\n|\n|\r/);
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  return lines;
}
function parseSeconds(s) {
  if (s.includes(":")) {
    const parts = s.split(":");
    const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10), sec = pyFloat(parts[2]);
    return isNaN(h) || isNaN(m) ? NaN : h * 3600 + m * 60 + sec;
  }
  return pyFloat(s);
}
function parseTimestamps(lines) {
  const re = tsRegex();
  const ts = new Float64Array(lines.length);
  let colon = false;
  for (let i = 0; i < lines.length; i++) {
    const m = re.exec(lines[i]);
    if (m && m[1] !== undefined) {
      if (m[1].includes(":")) colon = true;
      ts[i] = parseSeconds(m[1]);
    } else ts[i] = NaN;
  }
  return { ts, colon };
}
function rulesFor(list, fn) { return list.filter((r) => r.filePat.test(fn)); }

// 仮想V周期とタイマー満了行の挿入（Python: _process_vsync_insertion）
function processVsync(linesIn, srcIn, origIn, fileNames) {
  const n = linesIn.length;
  const src = srcIn.length === n ? srcIn : srcIn.concat(new Array(n - srcIn.length).fill(""));
  const { ts, colon } = parseTimestamps(linesIn);
  const fmt = (s) => {
    if (!colon) return `[${s.toFixed(6)}]`;
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${sec.toFixed(3).padStart(6, "0")}`;
  };
  const vc = state.config.vsync_auto_insert;

  // PASS 1: 仮想V周期の挿入
  let startTime = pyFloat(vc.start_time_val ?? "0.0");
  let startIdx = -1;
  if (isNaN(startTime)) startTime = null;
  else for (let i = 0; i < n; i++) if (!isNaN(ts[i]) && Math.abs(ts[i] - startTime) < 0.000001) { startIdx = i; break; }
  let manual = pyFloat(vc.manual_ms ?? 16.666);
  if (isNaN(manual)) manual = 16.666;
  const interval = manual / 1000.0;

  let L = [], S = [], T = [], O = [];
  if (startTime !== null) {
    let nextV = startTime + interval;
    for (let i = 0; i < n; i++) {
      const lt = ts[i];
      if (!isNaN(lt) && lt > startTime) {
        let cnt = 0;
        while (nextV < lt && cnt < 100) {
          L.push(`${fmt(nextV)} ${VSYNC_MARKER}`); S.push(VIRTUAL_SRC); T.push(nextV); O.push(0);
          nextV += interval; cnt++;
        }
        if (cnt >= 100) nextV = lt + interval;
      }
      L.push(i === startIdx ? `${linesIn[i]}  ${ORIGIN_MARK}` : linesIn[i]); S.push(src[i]); T.push(lt); O.push(origIn[i]);
    }
  } else { L = linesIn.slice(); S = src.slice(); T = Array.from(ts); O = origIn.slice(); }

  // PASS 2: 待ち時間付き区間のタイマー満了行の挿入
  const sections = state.sections;
  if (!sections.some((r) => r.dur > 0)) return { lines: L, srcs: S, orig: O };
  const byFn = Object.fromEntries(fileNames.map((fn) => [fn, rulesFor(sections, fn)]));
  const active = {}, pending = {};
  for (const fn of fileNames) { active[fn] = null; pending[fn] = null; }
  const FL = [], FS = [], FO = [];
  const timerLine = (exp, dur) => `${fmt(exp)} ---[VIRTUAL TIMER] Wait Time ${pyFloatStr(dur)}ms End ---`;

  for (let i = 0; i < L.length; i++) {
    const line = L[i], t = T[i], lineSrc = S[i];
    const isVirtual = lineSrc === VIRTUAL_SRC;
    const isVsyncLine = VSYNC_RE.test(line) && !line.includes(TIMER_MARK);
    if (!isNaN(t)) {
      const expired = [];
      for (const fn of fileNames) {
        const s = active[fn];
        if (s && s.rule.dur > 0 && !isNaN(s.startTs) && !s.timerExpired) {
          const exp = s.startTs + s.rule.dur / 1000.0;
          if (t >= exp - 0.000001) expired.push([exp, fn, s]);
        }
      }
      expired.sort((a, b) => a[0] - b[0]);
      for (const [exp, fnName, s] of expired) {
        FL.push(timerLine(exp, s.rule.dur)); FS.push(VIRTUAL_SRC); FO.push(0);
        s.timerExpired = true;
        if (s.rule.endStr === "") { if (s.rule.endWait) s.endPending = true; else active[fnName] = null; }
      }
    }
    FL.push(line); FS.push(lineSrc); FO.push(O[i]);

    for (const fn of fileNames) {
      if (active[fn] && active[fn].endPending && isVsyncLine) active[fn] = null;
      if (pending[fn] && isVsyncLine) {
        active[fn] = { rule: pending[fn].rule, startTs: t, endPending: false, timerExpired: false };
        pending[fn] = null;
      }
      if (fn === lineSrc) {
        for (const rule of byFn[fn]) {
          if (!rule.start.test(line)) continue;
          if (rule.startWait) pending[fn] = { rule };
          else {
            active[fn] = { rule, startTs: t, endPending: false, timerExpired: false };
            pending[fn] = null;
            let endMatch = false;
            if (rule.endStr !== "") endMatch = rule.end.test(line) && (fn === lineSrc || isVirtual || rule.isVsyncEnd);
            if (rule.dur > 0) endMatch = false;
            if (endMatch) { if (rule.endWait) active[fn].endPending = true; else active[fn] = null; }
          }
          break;
        }
      }
      const s = active[fn];
      if (s && !s.endPending) {
        const rule = s.rule;
        let cond = false;
        if (rule.endStr !== "") {
          let em = rule.end.test(line) && (fn === lineSrc || isVirtual || rule.isVsyncEnd);
          if (rule.dur > 0 && !s.timerExpired) em = false;
          cond = em;
        } else if (rule.dur > 0 && s.timerExpired && !s.timerExpiredHandled) {
          cond = true; s.timerExpiredHandled = true;
        }
        if (cond) { if (rule.endWait) s.endPending = true; else active[fn] = null; }
      }
    }
  }
  const remaining = [];
  for (const fn of fileNames) {
    const s = active[fn];
    if (s && s.rule.dur > 0 && !isNaN(s.startTs) && !s.timerExpired) {
      remaining.push([s.startTs + s.rule.dur / 1000.0, s.rule]);
      active[fn] = null;
    }
  }
  remaining.sort((a, b) => a[0] - b[0]);
  for (const [exp, rule] of remaining) { FL.push(timerLine(exp, rule.dur)); FS.push(VIRTUAL_SRC); FO.push(0); }
  return { lines: FL, srcs: FS, orig: FO };

        text = `${endedRule.name} (終了)${t}`;
      }
      if (pending[fn] && isVsyncLine) {
        if (active[fn]) {

async function openFromHandle(h) { const f = await h.getFile(); addDoc(f.name, await readFileText(f), fileSource(f, { handle: h })); }

// Chrome / Edge ではファイルハンドルで開く（F5 で同じファイルを読み直せる）

  let handles;
  try { handles = await window.showOpenFilePicker({ multiple: true }); }

const isFileDrag = (e) => !!e.dataTransfer && [...e.dataTransfer.types].includes("Files");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => { if (!isFileDrag(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add("drag"); });
window.addEventListener("dragleave", (e) => { if (!isFileDrag(e)) return; if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("drag"); } });
window.addEventListener("dragover", (e) => { if (isFileDrag(e)) e.preventDefault(); });
window.addEventListener("drop", (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("drag");
  // ハンドルの取得はイベント中に開始する必要がある
  const items = [...e.dataTransfer.items].filter((it) => it.kind === "file");
  const handleJobs = items.map((it) => (it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null)));
  const files = [...e.dataTransfer.files];
  (async () => {
    const handles = await Promise.all(handleJobs);
    for (let k = 0; k < files.length; k++) {
      const h = handles[k];
      if (h && h.kind === "directory") { setStatus(`フォルダは開けません: ${h.name}`); continue; }
      if (h && h.kind === "file") await openFromHandle(h);
      else await openFiles([files[k]]);
    }
  })();
});

    const nd = Object.assign(buildFileDoc(d.name, d.rawText, d.source), { sel: d.sel, base: d.base, scrollTop: d.scrollTop, scrollLeft: d.scrollLeft });
    fileDocs.set(d, nd);

  });

    const sources = state.docs.filter((x) => !x.isMerged && d.fileNames.includes(x.name));
    return sources.length >= 2 ? Object.assign(buildMergedDoc(sources, d.mergeTsLen), { sel: d.sel, base: d.base }) : d;

}

  if (!doc) return;
  const selSrc = doc.sel >= 0 ? doc.srcs[doc.sel] : null;
  const v = prompt(doc.isMerged ? `移動する元ファイルの行番号（${selSrc && selSrc !== VIRTUAL_SRC ? selSrc : doc.fileNames[0]}）` : "移動する行番号",
                   doc.sel >= 0 && doc.orig[doc.sel] ? doc.orig[doc.sel] : "");
  const n = parseInt(v, 10);
  if (!n) return;
  const wantSrc = doc.isMerged ? (selSrc && selSrc !== VIRTUAL_SRC ? selSrc : doc.fileNames[0]) : null;
  let target = -1;
  for (let i = 0; i < doc.lines.length; i++) {
    if (doc.orig[i] >= n && (!wantSrc || doc.srcs[i] === wantSrc)) { target = i; break; }
  }
  if (target < 0) { setStatus(`${n} 行目は見つかりませんでした`); return; }
  if (doc.view[lowerBound(doc.view, target)] !== target) setStatus(`${n} 行目は現在の表示条件で非表示のため、直後の表示行へ移動しました`);
  selectIndex(target);
}
document.addEventListener("keydown", (e) => {
  if (document.querySelector("dialog[open]")) return;
  if (e.key === "Escape") setMenuOpen(false);
  const doc = cur();
  const ctrl = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (ctrl && key === "f") { e.preventDefault(); $("search").focus(); $("search").select(); return; }
  if (ctrl && key === "g") { e.preventDefault(); gotoLinePrompt(); return; }
  if (ctrl && key === "o") { e.preventDefault(); openPicker(); return; }
  if (e.key === "F5" && !ctrl) { e.preventDefault(); reloadCurrent(); return; }
  if (ctrl && key === "w" && doc) { e.preventDefault(); closeDoc(state.active); return; }
  if (e.key === "F2") { e.preventDefault(); setFilter(!state.filterOn); return; }
  if (e.key === "F3") { e.preventDefault(); goHit(e.shiftKey ? -1 : 1); return; }
  if (e.key === "F8") { e.preventDefault(); nextColored(e.shiftKey ? -1 : 1); return; }
  if (e.target.tagName === "INPUT" || !doc || !doc.view.length) return;
  const pos = doc.sel >= 0 ? lowerBound(doc.view, doc.sel) : -1;
  const page = Math.max(1, Math.floor(scroller.clientHeight / rowH) - 2);
  const moves = { ArrowDown: 1, ArrowUp: -1, PageDown: page, PageUp: -page };
  if (e.key in moves) {
    e.preventDefault();
    const np = Math.max(0, Math.min(doc.view.length - 1, (pos < 0 ? 0 : pos) + moves[e.key]));
    doc.sel = doc.view[np]; scrollToPos(np); updateStatus();
  } else if (ctrl && (e.key === "Home" || e.key === "End")) {
    e.preventDefault();
    const np = e.key === "Home" ? 0 : doc.view.length - 1;
    doc.sel = doc.view[np]; scrollToPos(np); updateStatus();
  } else if (ctrl && key === "c" && !String(window.getSelection()) && doc.sel >= 0) {
    navigator.clipboard?.writeText(doc.lines[doc.sel]).catch(() => {});
    setStatus("選択行をコピーしました");
  }
});

// ================= ステータス =================
let statusMsg = "";
function setStatus(msg) { statusMsg = msg; updateStatus(); }
function updateStatus() {
  const doc = cur();
  const parts = [];
  if (doc) {
    parts.push(`表示 ${doc.view.length.toLocaleString()} / 全 ${doc.lines.length.toLocaleString()} 行`);
    if (doc.sel >= 0) parts.push(doc.orig[doc.sel] ? `選択: ${doc.isMerged ? doc.srcs[doc.sel] + " " : ""}${doc.orig[doc.sel]} 行目` : "選択: 仮想行");
  }
  if (statusMsg) parts.push(statusMsg);
  $("statusMain").textContent = parts.join("　|　") || "準備完了";
  $("statusErr").textContent = state.errors.length ? `無効な設定: ${state.errors.join(" / ")}` : "";
}

// ================= 初期化 =================
function measure() {
  const probe = document.createElement("div");
  probe.className = "row"; probe.style.visibility = "hidden";
  probe.innerHTML = '<span class="cell log" style="padding:0">' + "M".repeat(100) + "</span>";
  canvas.appendChild(probe);
  charW = probe.firstChild.getBoundingClientRect().width / 100 || 7.2;
  rowH = probe.getBoundingClientRect().height || 20;
  probe.remove();
}
state.config = loadStoredConfig();
measure();
compileRules();
updateVsyncInfo();
updateStatus();
layout();

// 開発用: ?config=xxx.json&file=a.log&file=b.log&merge=19（サーバー経由で開いた時のみ）
(async () => {
  const q = new URLSearchParams(location.search);
  try {
    if (q.get("config")) applyConfig(await (await fetch(q.get("config"))).json());
    for (const f of q.getAll("file")) {
      const res = await fetch(f);
      if (res.ok) { const buf = await res.arrayBuffer(); addDoc(f.split("/").pop(), decodeText(buf), { url: f, size: buf.byteLength, loadedAt: Date.now() }); }
    }
    if (q.get("merge")) mergeDocs(parseInt(q.get("merge"), 10));
  } catch (e) { setStatus(`読み込み失敗: ${e.message}`); }
})();

// 検証用: 表示内容を Python 版と比較できる形で取り出す
window.__lv = {
  state, addDoc, mergeDocs, applyConfig, setFilter, setShowVsync, setAdvanced, buildXlsx, reloadCurrent, moveTab, tabInfo,
  dump(doc, filterOn, showVsync) {
    const keep = [state.filterOn, state.showVsync];
    state.filterOn = filterOn; state.showVsync = showVsync;
    const vis = computeVisible(doc);
    [state.filterOn, state.showVsync] = keep;
    const rows = [];
    for (let i = 0; i < doc.lines.length; i++) {
      if (!vis[i]) continue;
      rows.push([doc.lines[i], doc.comments[i], doc.colors[i] === WHITE ? null : doc.colors[i],
        ...doc.fileNames.map((fn) => { const s = doc.status[fn] ? doc.status[fn][i] : ["", WHITE]; return [s[0], s[1] === WHITE ? null : s[1]]; })]);
    }
    return rows;
  },
};
</script>
